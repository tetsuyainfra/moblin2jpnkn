name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  deb:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}_${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # cargo-deb
      - name: Cache cargo-deb
        id: cache-cargo-deb
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deb
          key: cargo-deb-v3.8.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-deb
        if: steps.cache-cargo-deb.outputs.cache-hit != 'true'
        run: cargo install cargo-deb@3.8.0 --locked

      # Build deb package using cargo-deb
      - name: Build deb
        run: cargo deb

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: deb-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: sha256sum *.deb > SHA256SUMS

      - name: Sign SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes *.deb SHA256SUMS SHA256SUMS.asc

      # - name: Create GitHub release
      #   uses: softprops/action-gh-release@v3
      #   with:
      #     files: |
      #       *.deb
      #       SHA256SUMS
      #     generate_release_notes: true
