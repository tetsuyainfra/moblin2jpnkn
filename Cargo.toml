[package]
name = "moblin2jpnkn"
version = "0.1.0"
edition = "2021"
description = "Chat server for Moblin (XMPP over WebSocket) forwarding JPNKN MQTT messages"


[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
quick-xml = "0.37"
rumqttc = { version = "0.24", features = ["url"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"


[profile.release]
lto = true
strip = true


[package.metadata.deb]
maintainer = "tetsuyainfra <tetsuyainfra@gmail.com>"
copyright = "tetsuyainfra <tetsuyainfra@gmail.com>"
extended-description = """\
A server that connects Moblin chat clients to a JPNKN-compatible MQTT broker.
It provides an XMPP-over-WebSocket endpoint and relays chat messages through
configured MQTT topics. The listener and broker settings are read from
/etc/moblin2jpnkn/config.
"""
depends = "$auto"
section = "net"
priority = "optional"
assets = [
	["target/release/moblin2jpnkn", "usr/bin/", "755"],
	["packaging/config.example", "etc/moblin2jpnkn/config", "640"],
    ["README.md", "usr/share/doc/moblin2jpnkn/README", "644"],
]
maintainer-scripts = "packaging/debian"
systemd-units = { enable = true, start = false }